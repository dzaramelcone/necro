worker_processes 7;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    access_log off;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 30;
    keepalive_requests 100000;

    server {
        listen 8081 reuseport default_server;
        server_name _;

        location / {
            default_type application/json;
            return 200 '{"message":"Hello, World!"}';
        }
    }
}
